<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="theme-color" content="#F3F3F1">
  <title>Prévia · Lumina Class Barbearia</title>
  <meta name="description" content="Prévia de demonstração. Não é o site oficial.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
  <script>
    // Tema antes da página aparecer (evita piscar claro no tema escuro)
    (function () {
      var q = new URLSearchParams(location.search).get("tema");
      var c = window.SITE_CONFIG || {};
      var t = (q || c.tema || "claro").toLowerCase() === "escuro" ? "escuro" : "claro";
      var cores = (c.cores && c.cores[t]) || {};
      var r = document.documentElement;
      r.dataset.tema = t;
      if (cores.fundo) r.style.setProperty("--paper", cores.fundo);
      if (cores.texto) r.style.setProperty("--ink", cores.texto);
    })();
  </script>
</head>
<body>
  <div class="preview-bar" id="preview-bar" role="note" hidden></div>

  <header class="site-head" id="cabecalho"></header>

  <!-- Cada seção é preenchida pelo js/app.js a partir do config.js -->
  <main id="conteudo">
    <section class="hero" id="topo" aria-labelledby="hero-titulo"></section>
    <section class="section units-section" id="unidades" aria-labelledby="unidades-titulo"></section>
    <section class="section menu-section" id="servicos" aria-labelledby="servicos-titulo"></section>
    <section class="section feature-section" id="barboterapia" aria-labelledby="barboterapia-titulo"></section>
    <section class="section plan-section" id="assinatura" aria-labelledby="assinatura-titulo"></section>
    <section class="section school-section" id="escola" aria-labelledby="escola-titulo"></section>
  </main>

  <footer class="footer" id="rodape"></footer>

  <dialog class="sheet" id="dialog-unidade" aria-labelledby="dialog-titulo">
    <div class="sheet__inner">
      <form method="dialog" class="sheet__close"><button type="submit" aria-label="Fechar"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button></form>
      <h2 class="sheet__title" id="dialog-titulo">Em qual unidade?</h2>
      <p class="sheet__lead">Abre a agenda online da unidade no AppBarber: você escolhe o serviço, o barbeiro e o horário livre.</p>
      <div class="sheet__list" id="dialog-lista"></div>
      <a class="sheet__more" href="#unidades" data-fechar>Não sabe qual fica mais perto? Ver no mapa</a>
    </div>
  </dialog>

  <noscript>
    <div class="noscript">Ative o JavaScript para ver as unidades, horários e links de agendamento.</div>
  </noscript>

  <!-- Ícones -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8h3v3H8z"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.2-.5-.3Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Zm0-9.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m3 11 18-8-8 18-2-8-8-2Z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9L12 2.8Z"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Zm5 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm5.5-9.5h0"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h0"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 17H3v-5l2-5h14l2 5v5h-2M5 12h14M7 17a2 2 0 1 0 0 .1M17 17a2 2 0 1 0 0 .1M9 17h6"/></symbol>
    <symbol id="i-kid" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 0 0 5 0M12 3c-1 1.5-.5 3 1 3"/></symbol>
    <symbol id="i-access" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM9 9h6l-1 5h4l2 5M13 9l-1 5M10 12.5A5 5 0 1 0 15 19"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Zm8 9a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></symbol>
  </svg>

  <script src="js/app.js"></script>
</body>
</html>
